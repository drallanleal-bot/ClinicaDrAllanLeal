name: Aviso diario al teléfono

on:
  schedule:
    # GitHub a veces atrasa estas tareas varias horas: se programan tres intentos
    # y el aviso solo sale una vez al día (el primero que corra).
    - cron: '7 12 * * *'    # 6:07 a. m. hora de Guatemala
    - cron: '53 12 * * *'   # 6:53 a. m.
    - cron: '41 13 * * *'   # 7:41 a. m.
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Enviar aunque no haya pendientes'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: notificaciones
      - run: node notificaciones/enviar.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba }}
